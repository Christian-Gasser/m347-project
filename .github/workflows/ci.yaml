name: Docker Compose Action

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Run docker compose
        uses: hoverkraft-tech/compose-action@v2.0.1
        with:
          compose-file: "docker-compose.yaml"

      - name: 'Wait until the database is healthy'
        uses: raschmitt/wait-for-healthy-container/@master
        with:
          container-name: database
          timeout: 30

      - name: 'Wait until the frontend is healthy'
        uses: raschmitt/wait-for-healthy-container/@master
        with:
          container-name: frontend
          timeout: 60

      - name: 'Wait until the backend is healthy'
        uses: raschmitt/wait-for-healthy-container/@master
        with:
          container-name: backend
          timeout: 60

      - name: 'API tests'
        run: |
            SpaceId=$(curl --fail --request POST \
              --url http://localhost:8080/api/spaces \
              --header 'Content-Type: application/json' \
              --data '{"name": "Sample Space"}' | jq -r '.id')
            Space=$(curl --fail --request GET \
            --url http://localhost:8080/api/spaces/$SpaceId \
            --header 'Content-Type: application/json')

            SemesterId=$(curl --fail --request POST \
              --url http://localhost:8080/api/spaces/$SpaceId/semesters \
              --header 'Content-Type: application/json' \
              --data '{"name": "Sample Semester"}' | jq -r '.id')
            Semester=$(curl --fail --request GET \
            --url http://localhost:8080/api/spaces/$SpaceId/semesters/$SemesterId \
            --header 'Content-Type: application/json')

            SubjectId=$(curl --fail --request POST \
              --url http://localhost:8080/api/spaces/$SpaceId/semesters/$SemesterId/subjects \
              --header 'Content-Type: application/json' \
              --data '{"name": "Sample Subject"}' | jq -r '.id')
            Subject=$(curl --fail --request GET \
            --url http://localhost:8080/api/spaces/$SpaceId/semesters/$SemesterId/subjects/$SubjectId \
            --header 'Content-Type: application/json')

            GradeId=$(curl --fail --request POST \
              --url http://localhost:8080/api/spaces/$SpaceId/semesters/$SemesterId/subjects/$SubjectId/grades \
              --header 'Content-Type: application/json' \
              --data '{"name": "Sample Grade", "value": 5.0}' | jq -r '.id')
            Grade=$(curl --fail --request GET \
            --url http://localhost:8080/api/spaces/$SpaceId/semesters/$SemesterId/subjects/$SubjectId/grades/$GradeId \
            --header 'Content-Type: application/json')
